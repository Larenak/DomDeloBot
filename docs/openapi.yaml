                    place:
                      type: string
                    status:
                      anyOf:
                        - type: string
                          enum:
                            - draft
                        - type: string
                          enum:
                            - registered
                        - type: string
                          enum:
                            - assigned
                        - type: string
                          enum:
                            - in_progress
                        - type: string
                          enum:
                            - awaiting_resident_verification
                        - type: string
                          enum:
                            - resolved
                        - type: string
                          enum:
                            - disputed
                    confirmationsCount:
                      minimum: 1
                      type: integer
                    watchersCount:
                      minimum: 0
                      type: integer
                    isWatched:
                      type: boolean
                    canDelete:
                      type: boolean
                    responsibleOrganization:
                      type: string
                    assignee:
                      type: string
                    resultComment:
                      type: string
                    plannedCompletionAt:
                      format: date-time
                      type: string
                    deadline:
                      type: object
                      required:
                        - startedAt
                        - title
                        - note
                      properties:
                        startedAt:
                          format: date-time
                          type: string
                        dueAt:
                          format: date-time
                          type: string
                        stoppedAt:
                          format: date-time
                          type: string
                        title:
                          type: string
                        note:
                          type: string
                        sourceUrl:
                          format: uri
                          type: string
                        complaintGuideUrl:
                          format: uri
                          type: string
                    version:
                      minimum: 1
                      type: integer
                    isDemo:
                      type: boolean
                    createdAt:
                      format: date-time
                      type: string
                    updatedAt:
                      format: date-time
                      type: string
                    history:
                      type: array
                      items:
                        type: object
                        required:
                          - id
                          - toStatus
                          - actorName
                          - createdAt
                        properties:
                          id:
                            format: uuid
                            type: string
                          fromStatus:
                            anyOf:
                              - type: string
