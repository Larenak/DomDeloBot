openapi: 3.1.0
info:
  title: ДомДело API
  version: 0.1.0
  description: API MVP для коллективных дел жителей дома
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session
    demoUser:
      type: apiKey
      in: header
      name: X-Demo-User
  schemas: {}
paths:
  /api/public-config:
    get:
      responses:
        "200":
          description: Default Response
  /api/auth/max:
    post:
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - initData
              properties:
                initData:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Default Response
  /api/auth/me:
    get:
      responses:
        "200":
          description: Default Response
  /api/auth/house-invite:
    post:
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              additionalProperties: false
              properties:
                code:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
  /api/demo/users:
    get:
      responses:
        "200":
          description: Default Response
  /health/live:
    get:
      tags:
        - health
      responses:
        "200":
          description: Default Response
  /health/ready:
    get:
      tags:
        - health
      responses:
        "200":
          description: Default Response
  /api/addresses/suggest:
    get:
      tags:
        - houses
      parameters:
        - schema:
            type: string
            minLength: 2
            maxLength: 200
          in: query
          name: q
          required: true
      security: &a1
        - bearerAuth: []
        - demoUser: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - value
                    - isHouse
                  properties:
                    value:
                      type: string
                    isHouse:
                      type: boolean
                    fiasId:
                      format: uuid
                      type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
  /api/me/houses:
    get:
      tags:
        - houses
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - houses
                  - onboardingRequired
                  - accessPending
                properties:
                  houses:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - address
                        - isActive
                        - isDemo
                      properties:
                        id:
                          format: uuid
                          type: string
                        address:
                          type: string
                        fiasId:
                          format: uuid
                          type: string
                        isActive:
                          type: boolean
                        isDemo:
                          type: boolean
                  activeHouseId:
                    format: uuid
                    type: string
                  activeRole:
                    anyOf:
                      - type: string
                        enum:
                          - resident
                      - type: string
                        enum:
                          - chair
                      - type: string
                        enum:
                          - dispatcher
                      - type: string
                        enum:
                          - executor
                      - type: string
                        enum:
                          - authority
                      - type: string
                        enum:
                          - admin
                  onboardingRequired:
                    type: boolean
                  accessPending:
                    type: boolean
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
    post:
      tags:
        - houses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fiasId
              properties:
                fiasId:
                  format: uuid
                  type: string
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - houses
                  - onboardingRequired
                  - accessPending
                properties:
                  houses:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - address
                        - isActive
                        - isDemo
                      properties:
                        id:
                          format: uuid
                          type: string
                        address:
                          type: string
                        fiasId:
                          format: uuid
                          type: string
                        isActive:
                          type: boolean
                        isDemo:
                          type: boolean
                  activeHouseId:
                    format: uuid
                    type: string
                  activeRole:
                    anyOf:
                      - type: string
                        enum:
                          - resident
                      - type: string
                        enum:
                          - chair
                      - type: string
                        enum:
                          - dispatcher
                      - type: string
                        enum:
                          - executor
                      - type: string
                        enum:
                          - authority
                      - type: string
                        enum:
                          - admin
                  onboardingRequired:
                    type: boolean
                  accessPending:
                    type: boolean
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
        "422":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
  /api/me/houses/demo:
    post:
      tags:
        - houses
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - houses
                  - onboardingRequired
                  - accessPending
                properties:
                  houses:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - address
                        - isActive
                        - isDemo
                      properties:
                        id:
                          format: uuid
                          type: string
                        address:
                          type: string
                        fiasId:
                          format: uuid
                          type: string
                        isActive:
                          type: boolean
                        isDemo:
                          type: boolean
                  activeHouseId:
                    format: uuid
                    type: string
                  activeRole:
                    anyOf:
                      - type: string
