                enum:
                  - registered
              - type: string
                enum:
                  - assigned
              - type: string
                enum:
                  - in_progress
              - type: string
                enum:
                  - awaiting_resident_verification
              - type: string
                enum:
                  - resolved
              - type: string
                enum:
                  - disputed
          in: query
          name: status
          required: false
      security:
        - bearerAuth: []
        - demoUser: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - number
                    - houseId
                    - title
                    - description
                    - category
                    - place
                    - status
                    - confirmationsCount
                    - watchersCount
