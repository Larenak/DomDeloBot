  /api/reports/house:
    get:
      tags:
        - reports
      security:
        - bearerAuth: []
        - demoUser: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - houseId
                  - address
                  - asOf
                  - totalCases
                  - openCases
                  - overdueForecasts
                  - manyConfirmed
                  - categories
                  - source
                properties:
                  houseId:
                    format: uuid
                    type: string
                  address:
                    type: string
                  asOf:
                    format: date-time
                    type: string
                  totalCases:
                    minimum: 0
                    type: integer
                  openCases:
                    minimum: 0
                    type: integer
                  overdueForecasts:
                    minimum: 0
                    type: integer
                  manyConfirmed:
                    minimum: 0
                    type: integer
                  categories:
                    type: array
                    items:
                      type: object
                      required:
                        - category
                        - cases
                        - confirmations
                      properties:
                        category:
                          anyOf:
                            - type: string
                              enum:
                                - lighting
                            - type: string
                              enum:
                                - entrance
                            - type: string
                              enum:
                                - elevator
                            - type: string
                              enum:
                                - water
                            - type: string
                              enum:
                                - heating
                            - type: string
                              enum:
                                - yard
                            - type: string
                              enum:
                                - other
                        cases:
                          minimum: 0
                          type: integer
                        confirmations:
                          minimum: 0
                          type: integer
                  source:
                    type: string
                    enum:
                      - domdelo_internal
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
