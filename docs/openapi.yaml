                          - resident
                      - type: string
                        enum:
                          - chair
                      - type: string
                        enum:
                          - dispatcher
                      - type: string
                        enum:
                          - executor
                      - type: string
                        enum:
                          - authority
                      - type: string
                        enum:
                          - admin
                  onboardingRequired:
                    type: boolean
                  accessPending:
                    type: boolean
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  requestId:
                    type: string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
