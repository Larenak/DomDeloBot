server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api|health|webhooks|docs)(/|$) {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 9m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:9000 https:; connect-src 'self' https://platform-api2.max.ru http://localhost:9000; frame-ancestors https://max.ru https://web.max.ru;" always;
}

