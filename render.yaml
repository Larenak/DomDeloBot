services:
  - type: web
    name: domdelo-max
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: STORAGE_MODE
        value: postgres
      - key: OBJECT_STORAGE_MODE
        value: postgres
      - key: SERVE_WEB
        value: "true"
      - key: MAX_DELIVERY_MODE
        value: webhook
      - key: PUBLIC_BASE_URL
        fromService:
          name: domdelo-max
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MAX_MINI_APP_URL
        fromService:
          name: domdelo-max
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: domdelo-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_BOT_TOKEN
        sync: false
      - key: MAX_WEBHOOK_SECRET
        sync: false
      - key: HACKATHON_HOUSE_ID
        value: 11111111-1111-4111-8111-111111111111
      - key: HACKATHON_HOUSE_ADDRESS
        value: Демонстрационный дом

databases:
  - name: domdelo-db
    plan: free
    region: frankfurt
    databaseName: domdelo
    user: domdelo
